# Runs the Selenium/SpecFlow suite headless. Features run in parallel threads on this agent
# (see Parallel.cs). Override thread count with: -- NUnit.NumberOfTestWorkers=<n>
trigger:
  branches:
    include: [ main ]

pool:
  vmImage: ubuntu-latest   # Chrome is preinstalled; Selenium Manager fetches the driver

variables:
  buildConfiguration: Release

steps:
- task: UseDotNet@2
  displayName: Install .NET SDK from global.json
  inputs:
    packageType: sdk
    useGlobalJson: true
    includePreviewVersions: true

- script: dotnet test ShopAutomation.csproj -c $(buildConfiguration) --logger "trx;LogFileName=results.trx" --results-directory $(Agent.TempDirectory)/trx
  displayName: Run UI tests
  env:
    TEST_HEADLESS: 'true'      # no display on the agent
    TEST_BROWSER: chrome

- task: PublishTestResults@2
  displayName: Publish test results
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/trx/*.trx'
    failTaskOnFailedTests: true

- task: PublishPipelineArtifact@1
  displayName: Publish HTML report
  condition: always()
  inputs:
    targetPath: report.html
    artifact: html-report

- task: PublishPipelineArtifact@1
  displayName: Publish screenshots
  condition: always()
  inputs:
    targetPath: Screenshots
    artifact: screenshots
